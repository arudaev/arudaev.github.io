        <p>A playable portfolio by Alexander Rudaev, an artificial intelligence student at THD in Deggendorf.

        <p>JavaScript is needed to sail Harold the rubber duck. The projects and links below work without it.</p>

        <p><a href="/projects/">Read the full project index</a> without JavaScript or WebGL.</p>

          <li><a href="https://github.com/random-iceberg/docker-compose">Titanic ML Platform</a> – a team-built, five-service platform for training models and keeping prediction history.</li>
